services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: xlr8_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xlr8}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xlr8}
      POSTGRES_DB: xlr8_db
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xlr8} -d xlr8_db"]
      interval: 5s
      timeout: 5s
      retries: 5
